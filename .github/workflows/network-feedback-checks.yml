name: Check wired LAN address management

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch the LuCI revision used for the address regression
        run: |
          git init artifacts/luci-reference
          git -C artifacts/luci-reference fetch --depth=1 https://git.openwrt.org/project/luci.git 86d1549227ffef9cf60418583b7b4b9b0b06bc08
          git -C artifacts/luci-reference checkout --detach FETCH_HEAD
      - name: Check LAN address validation and patch compatibility
        run: python3 scripts/test_lan_address_ui.py --feed artifacts/luci-reference
      - name: Check wired-only ONU LuCI frontend
        env:
          TYFZA1_LUCI_FEED: artifacts/luci-reference
        run: node scripts/test_tyfza1_frontend.js
