name: Build macOS network diagnostic tool

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Bundle
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tyfza1-netwatch" dist/
          cp README.md sites.txt dist/
          tar -czf "tyfza1-netwatch-${{ matrix.target }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tyfza1-netwatch-${{ matrix.target }}
          path: tyfza1-netwatch-${{ matrix.target }}.tar.gz
          retention-days: 14

